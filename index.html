<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Knowledge & Practice Lab——围绕 AI 产品、Agent、评测与工程开发持续积累的知识与实践库。" />
    <meta name="theme-color" content="#080d12" />
    <title>AI Knowledge & Practice Lab</title>
    <!-- V4 样式加载顺序：legacy(过渡期共存) → tokens(单一变量源) → base(新组件原语) -->
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/views/home.css" />
    <link rel="stylesheet" href="./styles/views/index-views.css" />
    <link rel="stylesheet" href="./styles/components/hover-explain.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="paper-grain" aria-hidden="true"></div>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主要导航">
        <a class="brand" href="#/home" aria-label="AI Knowledge & Practice Lab 首页">
          <span class="brand-mark" aria-hidden="true"><i></i><b>AI</b></span>
          <span><strong>AI KNOWLEDGE LAB</strong><small>AI · PRODUCT · ENGINEERING</small></span>
        </a>
        <p class="sidebar-caption"><span>$</span> cd ~/knowledge-lab</p>
        
        <nav class="main-nav" aria-label="主导航">
          <a href="#/home" data-route="home"><span>01</span>首页</a>
          <a href="#/topics" data-route="topics"><span>02</span>术语</a>
          <a href="#/notes" data-route="notes"><span>03</span>笔记</a>
          <a href="#/reading" data-route="reading"><span>04</span>阅读</a>
          <a href="#/work" data-route="work"><span>05</span>实践</a>
          <a href="#/toolbox" data-route="toolbox"><span>06</span>工具箱</a>
          <a href="#/library" data-route="library"><span>07</span>资源库</a>
        </nav>

        <div class="sidebar-aux-block">
          <div class="nav-section-title">PERSONAL TOOLS</div>
          <nav class="aux-nav">
            <a href="#/practice" data-route="practice"><span>▷</span>测试运行</a>
            <a href="#/saved" data-route="saved"><span>◇</span>已保存</a>
            <a href="#/about" data-route="about"><span>◦</span>关于</a>
          </nav>
        </div>

        <div class="sidebar-foot">
          <div class="mini-progress">
            <span>已学 <strong id="sidebar-progress">0%</strong></span>
            <i><b id="sidebar-progress-bar"></b></i>
          </div>
          <div class="sidebar-actions">
            <button class="quick-capture-launcher" id="sidebar-quick-capture" type="button">
              <span>+</span> 快速记录推进 / 思考
            </button>
          </div>
        </div>
      </aside>

      <div class="content-shell">
        <header class="topbar">
          <button class="search-launcher" id="search-launcher" type="button">
            <span aria-hidden="true">⌕</span>
            <span>全局检索：术语、论文、思考、项目实验、工具箱与精选资源…</span>
            <kbd>/</kbd>
          </button>
          <div class="topbar-meta">
            <button class="topbar-capture-btn" id="topbar-quick-capture" type="button">
              <span>+</span> 记录推进
            </button>
            <span id="today-label"></span>
            <button class="theme-toggle-btn" id="theme-toggle" type="button" aria-label="切换夜航模式">夜航</button>
          </div>
        </header>
        <main id="main-content" tabindex="-1"></main>
      </div>
    </div>

    <nav class="mobile-nav" aria-label="移动端导航">
      <a href="#/home" data-route="home">首页</a>
      <a href="#/topics" data-route="topics">术语</a>
      <a href="#/notes" data-route="notes">笔记</a>
      <a href="#/reading" data-route="reading">阅读</a>
      <a href="#/work" data-route="work">实践</a>
      <a href="#/toolbox" data-route="toolbox">工具</a>
      <a href="#/library" data-route="library">资源</a>
    </nav>

    <!-- 全局检索弹窗 2.0 (支持 6 大核心模块全量检索) -->
    <dialog class="search-dialog" id="search-dialog">
      <form method="dialog" class="search-dialog-head">
        <label for="global-search">GLOBAL SEARCH 2.0 (全域跨分类知识检索)</label>
        <button aria-label="关闭搜索" value="cancel">关闭</button>
      </form>
      <div class="search-field">
        <span aria-hidden="true">⌕</span>
        <input id="global-search" type="search" autocomplete="off" placeholder="输入 Agent、RAG、MCP、Attention、评测、Prompt 或工具名…" />
      </div>
      <div class="search-results" id="search-results"></div>
      <p class="search-tip"><kbd>↑</kbd><kbd>↓</kbd> 浏览 · <kbd>Enter</kbd> 打开 · <kbd>Esc</kbd> 关闭 · 覆盖 术语/论文/思考/项目/工具/资源</p>
    </dialog>

    <!-- Quick Capture & AI Content Compiler 交互弹窗 -->
    <dialog class="capture-dialog" id="capture-dialog">
      <div class="capture-dialog-content" id="capture-dialog-container">
        <!-- 动态渲染 -->
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
